<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Clawd studio</title>
<style>
  /* every font is a local file: a render must not depend on the network */
  @font-face { font-family: "Permanent Marker"; src: url(assets/fonts/PermanentMarker-Regular.ttf); font-display: block; }
  @font-face { font-family: "ZCOOL KuaiLe"; src: url(assets/fonts/ZCOOLKuaiLe-Regular.ttf); font-display: block; }
  @font-face { font-family: "ZCOOL XiaoWei"; src: url(assets/fonts/ZCOOLXiaoWei-Regular.ttf); font-display: block; }
  @font-face { font-family: "Caveat Brush"; src: url(assets/fonts/CaveatBrush-Regular.ttf); font-display: block; }
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #F3EBDC; }
  .p5Canvas { display: none !important; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
<script src="node_modules/p5/lib/p5.min.js"></script>
<script src="node_modules/p5.brush/dist/p5.brush.js"></script>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="11" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<!-- engine -->
<script src="src/config.js"></script>
<script src="src/core.js"></script>
<script src="src/clawd.js"></script>
<script src="src/emotions_extra.js"></script>
<script src="src/lyrics.js"></script>
<script src="src/guests.js"></script>
<script src="src/timeline.js"></script>
<script src="src/props.js"></script>
<!-- reference sheets (standalone loops) -->
<script src="src/sheets.js"></script>
<script src="src/guest_sheets.js"></script>
<!-- your video: add a script per scene file, in order. For a song, make a project instead: scripts/new_project.mjs -->
<script src="src/scenes/demo.js"></script>
<script>
  // Open studio.html?loop=emotions (or views, guests, emotions_extra) to scrub a standalone loop instead of the video.
  const q = new URLSearchParams(location.search).get('loop'); if (q && LOOPS[q]) window.LOOP = LOOPS[q];
</script>
</body>
</html>
