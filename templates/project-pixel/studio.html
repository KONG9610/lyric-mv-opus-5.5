<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}} · studio (pixel style)</title>
<style>
  /* Text is cut from a font's 12 px bitmaps (SimSun by default, a system font on Windows). To use a pixel font of your
     own, put it in ./assets/fonts, declare it with @font-face here, and set window.PX_FONT to its name before px.js. */
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #0E0B1F; image-rendering: pixelated; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="11" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<!-- this project's settings, then the engine: the pixel style on the kit's timing helpers and shot list -->
<script src="config.js"></script>
<script src="../../src/core.js"></script>
<script src="../../src/timeline.js"></script>
<script src="../../src/pixel/px.js"></script>
<script src="../../src/pixel/pclawd.js"></script>
<script src="../../src/pixel/pguests.js"></script>
<!-- sprites cut from generated art (scripts/pixelize.mjs) and per-character lyric times (assets/timings.js) go here -->
<!-- casts -->
<!-- the film: one script per scene file, in order -->
<script src="scenes/main.js"></script>
<script>
  const q = new URLSearchParams(location.search).get('loop'); if (q && LOOPS[q]) window.LOOP = LOOPS[q];
</script>
</body>
</html>
